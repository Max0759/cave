<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Cave</title>
<meta name="theme-color" content="#6d1f2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Cave">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=8">
<script>
  // Thème choisi (étiquette / cave), appliqué avant l'affichage
  try { var t = localStorage.getItem('cave.theme'); if (t === 'etiquette' || t === 'cave') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Ma Cave</h1>
    <button id="syncBtn" class="sync" type="button" aria-label="État de la synchronisation"><span class="sync-dot"></span><span id="syncLabel"></span></button>
  </div>
  <div id="caveFilter" class="seg" role="tablist" aria-label="Choix de la cave"></div>
</header>

<main id="content"></main>

<nav class="tabs" aria-label="Navigation">
  <button data-tab="cave" type="button"><svg viewBox="0 0 24 24"><path d="M8 2h8v5a4 4 0 0 1-3 3.87V20h3v2H8v-2h3v-9.13A4 4 0 0 1 8 7z"/></svg><span>Cave</span></button>
  <button data-tab="boire" type="button"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.4l3.7 2.2-1 1.7L11 13.5V7z"/></svg><span>À boire</span></button>
  <button data-tab="journal" type="button"><svg viewBox="0 0 24 24"><path d="M4 4h16v2H4zm0 5h16v2H4zm0 5h10v2H4zm0 5h16v2H4z"/></svg><span>Journal</span></button>
  <button data-tab="analyse" type="button"><svg viewBox="0 0 24 24"><path d="M3 20h18v2H3zM5 17l4-6 4 3 5-8 2 1.3-6.2 9.7-4-3L6.7 18z"/></svg><span>Analyse</span></button>
  <button data-tab="bilan" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10h3v10zm6.5 0V4h3v16zM17 20v-7h3v7z"/></svg><span>Bilan</span></button>
</nav>

<button id="fabScan" class="fab fab-boire" type="button" aria-label="Photographier une bouteille pour la retrouver">📷<span>Scanner</span></button>
<button id="fab" class="fab" type="button" aria-label="Ajouter un vin">+</button>

<dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js?v=8"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
